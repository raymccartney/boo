<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Animation: Random Boo Ghost</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #projector-view {
            width: 100vw;
            height: 100vh;
            position: relative;
            transform: scaleX(-1); /* Keeps mirroring active for window testing */
        }

        #boo-character {
            width: 30vw; /* Base width */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Smooth transitions for size lunges and moving around the screen */
            transition: transform 0.5s ease-in-out, top 0.8s ease-in-out, left 0.8s ease-in-out;
        }

        #boo-image {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div id="projector-view">
        <div id="boo-character">
            <img id="boo-image" src="boo-chase-1.png" alt="Boo">
        </div>
    </div>

    <script>
        const booContainer = document.getElementById('boo-character');
        const booImg = document.getElementById('boo-image');
        
        let animationInterval;
        let behaviorTimeout;
        
        const chaseFrames = ['boo-chase-1.png', 'boo-chase-2.png', 'boo-chase-3.png'];
        const hideFrames = ['boo-hide-1.png', 'boo-hide-2.png'];
        
        let currentFrameIndex = 0;
        let currentMode = 'CHASE';

        // 1. CYCLE ANIMATION FRAMES
        function startAnimationLoop() {
            clearInterval(animationInterval);
            animationInterval = setInterval(() => {
                if (currentMode === 'CHASE') {
                    currentFrameIndex = (currentFrameIndex + 1) % chaseFrames.length;
                    booImg.src = chaseFrames[currentFrameIndex];
                } else if (currentMode === 'HIDE') {
                    currentFrameIndex = (currentFrameIndex + 1) % hideFrames.length;
                    booImg.src = hideFrames[currentFrameIndex];
                }
            }, 250); 
        }

        // 2. RANDOM MOVEMENT ENGINE (Only moves while chasing)
        function floatAround() {
            if (currentMode === 'CHASE') {
                // Generate a random position on screen (keeping 15% padding from borders)
                const randomTop = Math.floor(Math.random() * 70) + 15;
                const randomLeft = Math.floor(Math.random() * 70) + 15;
                
                booContainer.style.top = `${randomTop}%`;
                booContainer.style.left = `${randomLeft}%`;
            }
        }
        // Attempt a float adjustment every 1.2 seconds
        setInterval(floatAround, 1200);

        // 3. RANDOM BEHAVIOR BRAIN
        function updateBehavior() {
            // Flip a coin (50/50 chance) to toggle states
            if (Math.random() > 0.5) {
                // SWITCH TO CHASE MODE
                currentMode = 'CHASE';
                currentFrameIndex = 0;
                booContainer.style.transform = 'translate(-50%, -50%) scale(1.4)'; // Lunge closer
                console.log("Behavior: Chasing!");
            } else {
                // SWITCH TO HIDE MODE
                currentMode = 'HIDE';
                currentFrameIndex = 0;
                booContainer.style.transform = 'translate(-50%, -50%) scale(1)'; // Shrink back
                console.log("Behavior: Hiding!");
            }

            // Generate a random duration for this state (between 3 to 7 seconds)
            const nextChangeDelay = Math.floor(Math.random() * 4000) + 3000;
            behaviorTimeout = setTimeout(updateBehavior, nextChangeDelay);
        }

        // Start everything up
        startAnimationLoop();
        updateBehavior();
    </script>
</body>
</html>
