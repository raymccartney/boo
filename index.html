<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #projector-view {
            width: 100vw;
            height: 100vh;
            position: relative;
            transform: scaleX(-1); /* mirror */
        }

        #boo-character {
            width: 15vw; 
            position: absolute;
            transform: translate(-50%, -50%);
            transition: top 2.5s ease-in-out, left 2.5s ease-in-out; 
        }

        #boo-image {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div id="projector-view">
        <div id="boo1" class="boo-character" style="top: 30%; left: 25%;">
            <img id="img-boo1" class="boo-image" src="boo-chase-1.png" alt="Boo">
        </div>
        <div id="boo2" class="boo-character" style="top: 50%; left: 50%;">
            <img id="img-boo2" class="boo-image" src="boo-chase-1.png" alt="Boo">
        </div>
        <div id="boo3" class="boo-character" style="top: 70%; left: 75%;">
            <img id="img-boo3" class="boo-image" src="boo-chase-1.png" alt="Boo">
        </div>
    </div>

    <script>
        const chaseFrames = ['boo-chase-1.png', 'boo-chase-2.png', 'boo-chase-3.png'];
        const hideFrames = ['boo-hide-1.png', 'boo-hide-2.png'];
        
        class BooGhost {
            constructor(containerId, imageId) {
                this.container = document.getElementById(containerId);
                this.img = document.getElementById(imageId);
                this.currentMode = 'CHASE';
                this.frameIndex = 0;
                this.init();
            }

            init() {
                setInterval(() => this.animateFrames(), 250);
                setInterval(() => this.floatAround(), 2800);
                this.updateBehavior();
            }

            animateFrames() {
                if (this.currentMode === 'CHASE') {
                    this.frameIndex = (this.frameIndex + 1) % chaseFrames.length;
                    this.img.src = chaseFrames[this.frameIndex];
                } else if (this.currentMode === 'HIDE') {
                    this.frameIndex = (this.frameIndex + 1) % hideFrames.length;
                    this.img.src = hideFrames[this.frameIndex];
                }
            }

            floatAround() {
                if (this.currentMode === 'CHASE') {
                    const randomTop = Math.floor(Math.random() * 60) + 20;
                    const randomLeft = Math.floor(Math.random() * 60) + 20;
                    
                    this.container.style.top = `${randomTop}%`;
                    this.container.style.left = `${randomLeft}%`;
                }
            }

            updateBehavior() {
                if (Math.random() > 0.5) {
                    this.currentMode = 'CHASE';
                } else {
                    this.currentMode = 'HIDE';
                }

                const nextStateChange = Math.floor(Math.random() * 4000) + 4000;
                setTimeout(() => this.updateBehavior(), nextStateChange);
            }
        }

        window.onload = () => {
            const ghost1 = new BooGhost('boo1', 'img-boo1');
            const ghost2 = new BooGhost('boo2', 'img-boo2');
            const ghost3 = new BooGhost('boo3', 'img-boo3');
        };
    </script>
</body>
</html>
