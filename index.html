<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boo gonna get you</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: pointer;
        }
        #projector-view {
            width: 100vw;
            height: 100vh;
            position: relative;
            transform: scaleX(-1);
        }
        .boo-character {
            width: 15vw;
            height: 15vh;
            position: absolute !important;
            transform: translate(-50%, -50%);
            transition: top 3.5s ease-in-out, left 3.5s linear;
        }
        .boo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease-in-out;
        }
        #tap-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-family: sans-serif;
            font-size: 1.5rem;
            color: #e65c00;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="tap-overlay">tap to activate sus listening device</div>

    <div id="projector-view">
        <div id="boo1" class="boo-character" style="top: 20%; left: 65%;">
            <img id="img-boo1" class="boo-image" src="boo-chase-1.png" alt="Boo 1">
        </div>
        <div id="boo2" class="boo-character" style="top: 45%; left: 80%;">
            <img id="img-boo2" class="boo-image" src="boo-chase-1.png" alt="Boo 2">
        </div>
        <div id="boo3" class="boo-character" style="top: 75%; left: 70%;">
            <img id="img-boo3" class="boo-image" src="boo-chase-1.png" alt="Boo 3">
        </div>
    </div>

<script>
const chaseFrames = ['boo-chase-1.png', 'boo-chase-2.png', 'boo-chase-3.png'];
const hideFrames = ['boo-hide-1.png', 'boo-hide-2.png'];

class BooGhost {
    constructor(containerId, imageId, verticalOffset, initialLeft) {
        this.container = document.getElementById(containerId);
        this.img = document.getElementById(imageId);
        this.verticalOffset = verticalOffset;
        this.currentLeft = initialLeft; 
        this.currentMode = 'CHASE';
        this.frameIndex = 0;
        this.driftInterval = null;
        this.init();
    }

    init() {
        setInterval(() => this.animateFrames(), 250);
        this.startAmbientDrift();
    }

    animateFrames() {
        if (this.currentMode === 'CHASE') {
            this.frameIndex = (this.frameIndex + 1) % chaseFrames.length;
            this.img.src = chaseFrames[this.frameIndex];
        } else if (this.currentMode === 'HIDE') {
            if (this.frameIndex < hideFrames.length - 1) {
                this.frameIndex++;
                this.img.src = hideFrames[this.frameIndex];
            }
        }
    }

    startAmbientDrift() {
        this.stopAmbientDrift();
        this.currentMode = 'CHASE';
        this.container.style.transition = 'top 4s ease-in-out, left 4s ease-in-out';
        
        const doDrift = () => {
            if (this.currentMode === 'CHASE') {
                const randomTop = Math.floor(Math.random() * 60) + 20;
                const randomLeft = Math.floor(Math.random() * 60) + 20;
                
                this.img.style.transform = randomLeft < this.currentLeft ? 'scaleX(-1)' : 'scaleX(1)';
                
                this.currentLeft = randomLeft;
                this.container.style.top = randomTop + '%';
                this.container.style.left = randomLeft + '%';
            }
        };
        
        doDrift();
        this.driftInterval = setInterval(doDrift, 4500);
    }

    stopAmbientDrift() {
        if (this.driftInterval) {
            clearInterval(this.driftInterval);
            this.driftInterval = null;
        }
    }

    startFlight(targetLeft, faceLeft, durationMs) {
        this.stopAmbientDrift();
        this.currentMode = 'CHASE';
        this.frameIndex = 0;
        this.img.src = chaseFrames[0]; 
        this.img.style.transform = faceLeft ? 'scaleX(-1)' : 'scaleX(1)';
        
        this.container.style.transition = `top ${durationMs}ms ease-in-out, left ${durationMs}ms linear`;
        
        const driftTop = this.verticalOffset + (Math.floor(Math.random() * 10) - 5);
        this.currentLeft = targetLeft;
        this.container.style.top = driftTop + '%';
        this.container.style.left = targetLeft + '%';
    }

    switchToHideMode() {
        this.stopAmbientDrift();
        this.currentMode = 'HIDE';
        this.frameIndex = 0;
        this.img.src = hideFrames[0]; 

        const computedStyle = window.getComputedStyle(this.container);
        const currentLeftPixels = computedStyle.left;
        const currentTopPixels = computedStyle.top;

        this.currentLeft = (parseFloat(currentLeftPixels) / window.innerWidth) * 100;

        this.container.style.transition = 'none';
        this.container.style.left = currentLeftPixels;
        this.container.style.top = currentTopPixels;
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const logDiv = document.createElement('div');
    logDiv.style = "position:absolute; top:10px; left:10px; color:#00ff00; font-family:monospace; font-size:14px; z-index:999;";
    logDiv.innerText = "Status: Waiting for tap...";
    document.body.appendChild(logDiv);

    const ghosts = [
        new BooGhost('boo1', 'img-boo1', 20, 65),
        new BooGhost('boo2', 'img-boo2', 45, 80),
        new BooGhost('boo3', 'img-boo3', 75, 70)
    ];

    let globalHideTimeout;
    let idleReturnTimeout; 
    
    const msPerPercentUnit = 45; 

    function resetIdleTimeout() {
        clearTimeout(idleReturnTimeout);
        idleReturnTimeout = setTimeout(() => {
            logDiv.innerText = "status: nonchalant haunting";
            ghosts.forEach(ghost => ghost.startAmbientDrift());
        }, 30000); 
    }

    function triggerMoveLeft() {
        logDiv.innerText = "lets go - get the peeps at the gate";
        clearTimeout(globalHideTimeout);
        clearTimeout(idleReturnTimeout);

        const targetLeft = 10; 
        let shortestTravelTime = Infinity;
        const flightPlans = [];

        ghosts.forEach(ghost => {
            const distanceToCover = Math.abs(ghost.currentLeft - targetLeft);
            const calculatedDuration = distanceToCover * msPerPercentUnit;
            
            flightPlans.push({ ghost: ghost, duration: calculatedDuration });

            if (calculatedDuration < shortestTravelTime) {
                shortestTravelTime = calculatedDuration;
            }
        });

        flightPlans.forEach(plan => {
            plan.ghost.startFlight(targetLeft, true, plan.duration);
        });

        globalHideTimeout = setTimeout(() => {
            ghosts.forEach(ghost => ghost.switchToHideMode());
            resetIdleTimeout(); 
        }, shortestTravelTime);
    }

    function triggerMoveRight() {
        logDiv.innerText = "lets go - get the peeps at the door";
        clearTimeout(globalHideTimeout);
        clearTimeout(idleReturnTimeout);

        const targetLeft = 90; 
        let shortestTravelTime = Infinity;
        const flightPlans = [];

        ghosts.forEach(ghost => {
            const distanceToCover = Math.abs(targetLeft - ghost.currentLeft);
            const calculatedDuration = distanceToCover * msPerPercentUnit;
            
            flightPlans.push({ ghost: ghost, duration: calculatedDuration });

            if (calculatedDuration < shortestTravelTime) {
                shortestTravelTime = calculatedDuration;
            }
        });

        flightPlans.forEach(plan => {
            plan.ghost.startFlight(targetLeft, false, plan.duration);
        });

        globalHideTimeout = setTimeout(() => {
            ghosts.forEach(ghost => ghost.switchToHideMode());
            resetIdleTimeout(); 
        }, shortestTravelTime);
    }

    document.addEventListener('keydown', (event) => {
        if (document.getElementById('tap-overlay').style.display === 'none') {
            if (event.key.toLowerCase() === 'a') {
                triggerMoveLeft();
            } else if (event.key.toLowerCase() === 'd') {
                triggerMoveRight();
            }
        }
    });

    document.getElementById('projector-view').addEventListener('click', (event) => {
        const screenWidth = window.innerWidth;
        const clickX = event.clientX;

        if (clickX < screenWidth / 2) {
            triggerMoveLeft();
        } else {
            triggerMoveRight();
        }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false; 
        recognition.interimResults = true;
        recognition.lang = 'en-GB';

        recognition.onstart = () => {
            logDiv.innerText = "status: waiting for bro to say something fire";
        };

        recognition.onerror = (event) => {
            if (event.error !== 'no-speech') {
                logDiv.innerText = "skill issue: yo mic is wack" + event.error;
            }
        };

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i].transcript;
            }

            const currentSpeech = transcript.toLowerCase().trim();
            logDiv.innerText = "someone said: " + currentSpeech;

            if (currentSpeech.includes('boo gate') || currentSpeech.includes('gate')) {
                triggerMoveLeft();
                recognition.stop();
            }else if (currentSpeech.includes('boo door') || currentSpeech.includes('door')) {
                triggerMoveRight();
                recognition.stop();
            }
        };

        recognition.onend = () => {
            if (shouldListen) {
                try { recognition.start(); } catch(e) {}
            }
        };

        document.getElementById('tap-overlay').addEventListener('click', (e) => {
            shouldListen = true;
            recognition.start();
            resetIdleTimeout();
            document.getElementById('tap-overlay').style.display = 'none';
            e.stopPropagation();
        });

    } else {
        logDiv.innerText = "skill issue: yo browser is wack";
    }
});


    </script>
</body>
</html>
